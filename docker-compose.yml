# Local facility-node run of the Matibabu backend.
# Usage:
#   docker compose up --build
# API: http://localhost:8080
# Swagger: http://localhost:8080/swagger-ui.html
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: matibabu-backend:local
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:sqlite:/data/matibabu.db
      APP_FACILITY_ID: "00000000-0000-4000-8000-000000000001"
      APP_CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173"
    volumes:
      - matibabu-data:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

volumes:
  matibabu-data:
