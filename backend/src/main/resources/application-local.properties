#spring.datasource.url=jdbc:sqlite::memory:
spring.datasource.url=jdbc:sqlite:matibabu-local.db
spring.datasource.driver-class-name=org.sqlite.JDBC

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/sqlite

server.port=8080

# Fixed placeholder facility identity for local development.
app.facility.id=00000000-0000-4000-8000-000000000001