# Test defaults — no developer machine state, no local file DB.
spring.main.banner-mode=off
spring.profiles.active=test

spring.datasource.url=jdbc:sqlite:file:matibabu-test?mode=memory&cache=shared
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/sqlite


# Facility node identity for tests that boot the full context
app.facility.id=00000000-0000-4000-8000-000000000001
app.node.role=facility
app.cors.allowed-origins=http://localhost:3000

# Session / security — keep CSRF on; tests that need auth mock or use test config
server.servlet.session.timeout=30m
spring.session.jdbc.initialize-schema=never
